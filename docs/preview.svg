      <text x="342" y="231" fill="#a7a9b6" font-family="sans-serif" font-size="12">Resets at 1:30 PM</text>
      <text x="342" y="269" fill="#e4e5eb" font-family="sans-serif" font-size="13">Weekly limit: 55% left</text>
      <text x="342" y="289" fill="#a7a9b6" font-family="sans-serif" font-size="12">Resets at 8:00 AM</text>
