      <text x="145" y="291" fill="#e1e3ec" font-family="sans-serif" font-size="13">◷  5-hour limit</text>
      <text x="145" y="310" fill="#a4a8b6" font-family="sans-serif" font-size="11">Resets at 1:30 PM</text>
      <text x="446" y="299" fill="#d6d8e1" font-family="sans-serif" font-size="11">80% left</text>
      <text x="145" y="353" fill="#e1e3ec" font-family="sans-serif" font-size="13">◷  Weekly limit</text>
      <text x="145" y="372" fill="#a4a8b6" font-family="sans-serif" font-size="11">Resets at 8:00 AM</text>
      <text x="446" y="361" fill="#d6d8e1" font-family="sans-serif" font-size="11">55% left</text>
      <text x="141" y="418" fill="#9398a9" font-family="sans-serif" font-size="11" letter-spacing="1">UPDATED</text>
