<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
  <title id="title">Codex Status interface preview</title>
  <desc id="description">A GNOME top bar indicator with its status menu beside the Vicinae detail view.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35435f"/>
      <stop offset="1" stop-color="#202332"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1440" height="860" fill="#11131b"/>
  <text x="70" y="62" fill="#9b9eb0" font-family="sans-serif" font-size="13" letter-spacing="2">INTERFACE PREVIEW · SAMPLE DATA</text>
