    <text x="450" y="85" fill="#e6e8f0" font-family="sans-serif" font-size="12">◉</text>
    <text x="477" y="85" fill="#e6e8f0" font-family="sans-serif" font-size="12">⌁</text>
    <rect x="502" y="67" width="99" height="26" rx="7" fill="#292d3a"/>
    <text x="513" y="85" fill="#f1f2f7" font-family="sans-serif" font-size="13" font-weight="600">Codex 80%</text>
    <g filter="url(#shadow)">
      <rect x="324" y="111" width="276" height="275" rx="11" fill="#222530" stroke="#393d4b"/>
      <text x="342" y="143" fill="#e4e5eb" font-family="sans-serif" font-size="14">Signed in with ChatGPT</text>
      <text x="342" y="175" fill="#a7a9b6" font-family="sans-serif" font-size="13">Plan: plus</text>
